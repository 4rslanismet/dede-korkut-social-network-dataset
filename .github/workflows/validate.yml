name: validate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Run validation-only pipeline
        run: python run_pipeline.py --all --validate-only

    # Note (section 103): heavy null-model / sensitivity / robustness stages
    # (n_random=1000 ensembles, 100-trial random removal) are intentionally
    # NOT run in CI - they're development/analysis stages, not a merge gate.
    # Run them locally via `python run_pipeline.py --all` before a release.
